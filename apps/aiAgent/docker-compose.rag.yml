name: aiagent-rag
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: ${RAG_DB_NAME:-hs_rag}
      POSTGRES_USER: ${RAG_DB_USER:-rag}
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:?Set RAG_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RAG_DB_PORT:-55432}:5432"
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  cliproxyapi:
    image: aiagent-cliproxyapi:8.0.29
    build:
      context: ./config/cliproxyapi
    command: ["./CLIProxyAPI", "-config", "/CLIProxyAPI/config/config.yaml"]
    env_file:
      - ./config/cliproxyapi/local/credentials.env
    environment:
      TZ: Asia/Ho_Chi_Minh
      MANAGEMENT_STATIC_PATH: /CLIProxyAPI/static
    ports:
      - "127.0.0.1:${CLIPROXYAPI_PORT:-8317}:8317"
      - "127.0.0.1:51121:51121"
    volumes:
      - type: bind
        source: ./config/cliproxyapi/local
        target: /CLIProxyAPI/config
        bind:
          create_host_path: false
      - cliproxyapi-auth:/root/.cli-proxy-api
      - cliproxyapi-logs:/CLIProxyAPI/logs
      - cliproxyapi-static:/CLIProxyAPI/static
      - cliproxyapi-plugins:/CLIProxyAPI/plugins
    restart: unless-stopped
volumes:
  rag-postgres-data:
  cliproxyapi-auth:
  cliproxyapi-logs:
  cliproxyapi-static:
  cliproxyapi-plugins:
