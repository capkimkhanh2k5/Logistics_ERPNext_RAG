# Generate local/config.yaml and local/credentials.env with scripts/init_cliproxyapi.py.
config-version: 8
server:
  host: "0.0.0.0"
  port: 8317
management:
  # Docker forwards host requests from its bridge. Host ports bind to 127.0.0.1.
  allow-remote: true
  # MANAGEMENT_PASSWORD comes from the ignored local/credentials.env file.
  secret-key: ""
  disable-control-panel: false
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"
access:
  api-keys:
    - "__CLIENT_API_KEY__"
oauth:
  auth-dir: "/root/.cli-proxy-api"
routing:
  strategy: "round-robin"
  session-affinity: true
  session-affinity-ttl: "1h"
observability:
  logs:
    debug: false
    logging-to-file: true
    logs-max-total-size-mb: 100
    error-logs-max-files: 10
    request-log: false
  usage:
    usage-statistics-enabled: true
plugins:
  enabled: false
  dir: "/CLIProxyAPI/plugins"
