[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_service"
version = "0.1.0"
description = "AI Service Platform for Global Trade & Logistics"
authors = [{ name = "Logistics Team" }]
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = [".", "ai_rag", "ai_agent"]
testpaths = ["ai_rag/tests"]
