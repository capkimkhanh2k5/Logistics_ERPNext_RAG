services:
  backend:
    env_file: .env
    image: logistics_wizard_frappe:latest
    build: .
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
      RAG_DB_HOST: postgres
      RAG_DB_PORT: "5432"
      CLIPROXYAPI_BASE_URL: http://cliproxyapi:8317/v1
    depends_on:
      create-site:
        condition: service_completed_successfully

  # ── Step 1: Set global bench config (runs every time on startup) ──
  configurator:
    image: logistics_wizard_frappe:latest
    build: .
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: none
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  # ── Step 2: Create site + install apps + build assets (runs once, idempotent) ──
  create-site:
    image: logistics_wizard_frappe:latest
    build: .
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: none
    entrypoint:
      - bash
      - /home/frappe/frappe-bench/create-site.sh
    environment:
      FRAPPE_SITE_NAME: logistics.local
      ADMIN_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - ./backups:/home/frappe/frappe-bench/backups:ro
      - ./create-site.sh:/home/frappe/frappe-bench/create-site.sh
    depends_on:
      configurator:
        condition: service_completed_successfully

  db:
    image: mariadb:11.8
    networks:
      - frappe_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    image: logistics_wizard_frappe:latest
    build: .
    networks:
      - frappe_network
    depends_on:
      create-site:
        condition: service_completed_successfully
      websocket:
        condition: service_started
      backend:
        condition: service_started
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: logistics.local
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "2828:8080"

  queue-long:
    image: logistics_wizard_frappe:latest
    build: .
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      create-site:
        condition: service_completed_successfully

  queue-short:
    image: logistics_wizard_frappe:latest
    build: .
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      create-site:
        condition: service_completed_successfully

  redis-queue:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure

  scheduler:
    image: logistics_wizard_frappe:latest
    build: .
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      create-site:
        condition: service_completed_successfully

  websocket:
    image: logistics_wizard_frappe:latest
    build: .
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      create-site:
        condition: service_completed_successfully

  # ── AI RAG Services ────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    networks:
      - frappe_network
    env_file:
      - ./apps/ai_service/ai_rag/.env
    ports:
      - "127.0.0.1:${RAG_DB_PORT:-55432}:5432"
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      restart_policy:
        condition: on-failure

  cliproxyapi:
    image: aiagent-cliproxyapi:8.0.29
    build:
      context: ./apps/ai_service/ai_rag/config/cliproxyapi
    command: ["./CLIProxyAPI", "-config", "/CLIProxyAPI/config/config.yaml"]
    env_file:
      - ./apps/ai_service/ai_rag/config/cliproxyapi/local/credentials.env
    environment:
      TZ: Asia/Ho_Chi_Minh
      MANAGEMENT_STATIC_PATH: /CLIProxyAPI/static
    ports:
      - "127.0.0.1:${CLIPROXYAPI_PORT:-8317}:8317"
      - "127.0.0.1:51121:51121"
    networks:
      - frappe_network
    volumes:
      - type: bind
        source: ./apps/ai_service/ai_rag/config/cliproxyapi/local
        target: /CLIProxyAPI/config
        bind:
          create_host_path: false
      - cliproxyapi-auth:/root/.cli-proxy-api
      - cliproxyapi-logs:/CLIProxyAPI/logs
      - cliproxyapi-static:/CLIProxyAPI/static
      - cliproxyapi-plugins:/CLIProxyAPI/plugins
    restart: unless-stopped

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:
  rag-postgres-data:
    name: aiagent-rag_rag-postgres-data
    external: true
  cliproxyapi-auth:
    name: aiagent-rag_cliproxyapi-auth
    external: true
  cliproxyapi-logs:
    name: aiagent-rag_cliproxyapi-logs
    external: true
  cliproxyapi-static:
    name: aiagent-rag_cliproxyapi-static
    external: true
  cliproxyapi-plugins:
    name: aiagent-rag_cliproxyapi-plugins
    external: true

networks:
  frappe_network:
    driver: bridge
